version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      gh-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /syslog
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ghcr.io/home-assistant/amd64-base-debian
        update-types: [version-update:semver-major]
